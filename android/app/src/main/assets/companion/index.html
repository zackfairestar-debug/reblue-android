<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>re:Blue · Dual Screen</title>
<link rel="stylesheet" href="companion.css?v=3">
</head>
<body>
<!-- Laid out in the camp menu's own units (its 1280x720 canvas) and scaled to the screen.
     Like a 3DS game's bottom screen it follows the game: the title shows the logo, the field
     the camp menu, a battle the battle view and a scene the scene view. -->
<div id="stage">
  <div id="app">
    <header id="top">
      <div class="win place"><span id="location">Blue Dragon</span><span id="mode" class="mode"></span></div>
      <div class="win gold"><i class="spr hdr-gold"></i><span class="txt-gold">Oro</span><span id="gold" class="num"></span></div>
      <button id="sleepBtn" class="win tool" aria-label="sleep">☾</button>
      <button id="settingsBtn" class="win tool" aria-label="settings">⚙</button>
    </header>

    <nav id="commands"></nav>

    <main id="views">
      <section id="view-waiting" class="view">
        <div class="splash">
          <div class="logo">BLUE DRAGON</div>
          <div class="logo-sub">re:Blue</div>
          <div id="waitingText" class="waiting"></div>
        </div>
      </section>

      <section id="view-party" class="view">
        <div id="cards" class="cards"></div>
        <div id="detail" class="win detail"></div>
      </section>

      <section id="view-shadow" class="view">
        <div id="shadowFaces" class="faces"></div>
        <div id="shadowGrid" class="classes"></div>
      </section>

      <section id="view-bag" class="view">
        <div class="win title-row"><span data-i18n="items"></span><span id="bagCount" class="num"></span></div>
        <div id="bagGrid" class="bag"></div>
      </section>

      <section id="view-map" class="view">
        <div class="win map-area">
          <canvas id="minimap"></canvas>
          <div id="mapNote" class="map-note"></div>
          <div class="map-tools">
            <button class="win tool-txt" id="mapFollow" data-i18n="follow"></button>
            <button class="win tool-txt" id="mapAll" data-i18n="whole"></button>
          </div>
          <div class="zoom">
            <button class="win tool" id="zoomIn">＋</button>
            <button class="win tool" id="zoomOut">－</button>
          </div>
        </div>
        <div id="legend" class="win legend"></div>
      </section>

      <section id="view-log" class="view">
        <div class="win title-row"><span data-i18n="journal"></span><span id="logCount" class="num"></span></div>
        <div id="journal" class="win journal"></div>
      </section>

      <section id="view-battle" class="view">
        <div id="enemies" class="win enemies"></div>
        <div id="turn" class="win turn"></div>
        <div id="battleLog" class="win blog"></div>
        <div id="battleCards" class="cards compact"></div>
      </section>

      <section id="view-scene" class="view">
        <div class="win scene-plate">
          <div class="scene-tag" data-i18n="scene"></div>
          <div id="sceneWhere" class="scene-where"></div>
          <div id="sceneMeta" class="scene-meta"></div>
        </div>
        <div id="sceneFaces" class="scene-faces"></div>
        <div class="win scene-log">
          <div class="sub" data-i18n="lately"></div>
          <div id="sceneLog"></div>
        </div>
      </section>
    </main>

    <div id="sheet" class="sheet hidden"><div class="win sheet-card" id="sheetCard"></div></div>
  </div>
</div>

<div id="sleep" class="sleep hidden"><div id="sleepClock" class="clock"></div><div data-i18n="wake"></div></div>
<div id="dim"></div>

<div id="settings" class="modal hidden">
  <div class="modal-box">
    <div class="win modal-win">
      <div class="modal-title" data-i18n="settings"></div>
      <label class="row"><span data-i18n="language"></span>
        <select id="optLang"><option value="auto">Auto</option><option value="es">Español</option><option value="en">English</option></select>
      </label>
      <label class="row"><span data-i18n="optPower"></span>
        <select id="optPower"><option value="0" data-i18n="powerOff"></option><option value="1" data-i18n="powerAuto"></option><option value="2" data-i18n="powerMax"></option></select>
      </label>
      <p id="perfStatus" class="hint"></p>
      <label class="row"><span data-i18n="optHaptics"></span><input type="checkbox" id="optHaptics"></label>
      <label class="row"><span data-i18n="optBattle"></span><input type="checkbox" id="optBattle"></label>
      <label class="row"><span data-i18n="optScene"></span><input type="checkbox" id="optScene"></label>
      <label class="row"><span data-i18n="optRest"></span><input type="checkbox" id="optRest"></label>
      <label class="row"><span data-i18n="optRestMin"></span><span class="rng"><input type="range" id="optRestMin" min="1" max="15" step="1"><output id="optRestOut"></output></span></label>
      <label class="row"><span data-i18n="optBright"></span><span class="rng"><input type="range" id="optBright" min="30" max="100" step="5"><output id="optBrightOut"></output></span></label>
      <div class="row"><span data-i18n="optClear"></span><button type="button" id="optClear" class="win btn" data-i18n="clear"></button></div>
      <p id="artStatus" class="hint"></p>
      <div class="modal-actions">
        <button id="disableBtn" class="win btn" data-i18n="disable"></button>
        <button id="closeSettings" class="win btn" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<script src="companion.js?v=4"></script>
</body>
</html>
