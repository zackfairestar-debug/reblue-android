<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>re:Blue · Dual Screen</title>
<link rel="stylesheet" href="companion.css">
</head>
<body>
<!-- Laid out in the camp menu's own units (its 1280x720 canvas) and scaled to the screen. -->
<div id="stage">
  <div id="app">
    <header id="top">
      <div class="win place"><span id="location">Blue Dragon</span><span id="mode" class="mode"></span></div>
      <div class="win gold"><i class="spr hdr-gold"></i><span class="txt-gold">Oro</span><span id="gold" class="num"></span></div>
      <button id="sleepBtn" class="win tool" aria-label="sleep">☾</button>
      <button id="settingsBtn" class="win tool" aria-label="settings">⚙</button>
    </header>

    <nav id="commands"></nav>

    <main id="views">
      <section id="view-waiting" class="view">
        <div class="splash">
          <div class="logo">BLUE DRAGON</div>
          <div id="waitingText" class="waiting"></div>
        </div>
      </section>

      <section id="view-party" class="view">
        <div id="cards" class="cards"></div>
        <div id="detail" class="win detail"></div>
      </section>

      <section id="view-shadow" class="view">
        <div id="shadowFaces" class="faces"></div>
        <div id="shadowGrid" class="classes"></div>
      </section>

      <section id="view-bag" class="view">
        <div class="win title-row"><span data-i18n="items"></span><span id="bagCount" class="num"></span></div>
        <div id="bagGrid" class="bag"></div>
      </section>

      <section id="view-map" class="view">
        <div class="win map-area">
          <canvas id="minimap"></canvas>
          <div id="mapNote" class="map-note"></div>
          <div class="zoom">
            <button class="win tool" id="zoomIn">＋</button>
            <button class="win tool" id="zoomOut">－</button>
          </div>
        </div>
        <div id="legend" class="win legend"></div>
      </section>

      <section id="view-battle" class="view">
        <div id="enemies" class="win enemies"></div>
        <div id="battleCards" class="cards compact"></div>
      </section>
    </main>
  </div>
</div>

<div id="sleep" class="sleep hidden"><div data-i18n="wake"></div></div>

<div id="settings" class="modal hidden">
  <div class="modal-box">
    <div class="win modal-win">
      <div class="modal-title" data-i18n="settings"></div>
      <label class="row"><span data-i18n="language"></span>
        <select id="optLang"><option value="auto">Auto</option><option value="es">Español</option><option value="en">English</option></select>
      </label>
      <label class="row"><span data-i18n="optHaptics"></span><input type="checkbox" id="optHaptics"></label>
      <label class="row"><span data-i18n="optBattle"></span><input type="checkbox" id="optBattle"></label>
      <p id="artStatus" class="hint"></p>
      <div class="modal-actions">
        <button id="disableBtn" class="win btn" data-i18n="disable"></button>
        <button id="closeSettings" class="win btn" data-i18n="close"></button>
      </div>
    </div>
  </div>
</div>

<script src="companion.js"></script>
</body>
</html>
