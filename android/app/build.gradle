plugins {
    id 'com.android.application'
}

android {
    namespace = 'org.reblue.android'
    compileSdk = 35
    // Must match the NDK the native libraries were built with, so the
    // packager strips their debug info with the same toolchain.
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'org.reblue.android'
        // backtrace() in the crash handler is API 33, and anything able to
        // run the game ships Android 13 or later anyway.
        minSdk = 33
        targetSdk = 35
        versionCode = 10304
        versionName = '1.3.1-android.4'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // SDL validates that its Java glue and the native library come
            // from the same revision, so take the Java straight from the SDK's
            // SDL submodule instead of a copy that could drift.
            java.srcDirs += '../../rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java'
            // Filled by scripts/build-apk.ps1: libreblue.so, librexruntime.so,
            // libc++_shared.so.
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // A personal build of your own game: signed with the debug key so
            // it installs without a keystore of your own.
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            // Stored uncompressed and page aligned, so the recompiled game
            // (hundreds of MB) is mapped straight from the APK.
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}
